Services :
	anomaly_detector
		type : NamedIndividual/Service/Thing/DTComponent/FidelityThing/ContainedElement/DescribedThing/Component/ImplementationThing/TimeScaleThing/ConceptInstance
		atStage : operation
		provides : anomaly_warning
		sameAs : anomaly_detector
		enabledBy : anomaly_detector_enabler/state_estimator
	policy_optimization
		type : NamedIndividual/Service/Thing/DTComponent/FidelityThing/ContainedElement/DescribedThing/Component/ImplementationThing/TimeScaleThing/ConceptInstance
		atStage : operation
		provides : controller_control
		sameAs : policy_optimization
		enabledBy : dashboard_enabler
	real_time_viz_service
		type : NamedIndividual/Service/Thing/DTComponent/FidelityThing/ContainedElement/DescribedThing/Component/ImplementationThing/TimeScaleThing/ConceptInstance
		atStage : operation
		provides : real_time_viz
		HasVisualization : true
		sameAs : real_time_viz_service
		enabledBy : godot
	heater_state_estimation_service
		type : NamedIndividual/Service/Thing/DTComponent/FidelityThing/ContainedElement/DescribedThing/Component/ImplementationThing/TimeScaleThing/ConceptInstance
		atStage : operation
		provides : heater_state_estimation
		sameAs : heater_state_estimation_service
		enabledBy : state_estimator
	safe_adaptation
		type : NamedIndividual/Service/Thing/DTComponent/FidelityThing/ContainedElement/DescribedThing/Component/ImplementationThing/TimeScaleThing/ConceptInstance
		atStage : operation
		provides : controller_control
		sameAs : safe_adaptation
		enabledBy : optimization_algs/state_estimator
	what_if_sim
		type : NamedIndividual/Service/Thing/DTComponent/FidelityThing/ContainedElement/DescribedThing/Component/ImplementationThing/TimeScaleThing/ConceptInstance
		atStage : operation
		provides : what_if_sim_results
		sameAs : what_if_sim
		enabledBy : simulator
Enablers :
	anomaly_detector_enabler
		type : NamedIndividual/Enabler/Thing/DTComponent/FidelityThing/ContainedElement/DescribedThing/Component/ImplementationThing/ConceptInstance
		enables : anomaly_detector
		sameAs : anomaly_detector_enabler
		hasInput : ANN_model/ANN_state_estimation_model/four_para_model/two_para_model
	dashboard_enabler
		type : NamedIndividual/Enabler/Thing/DTComponent/FidelityThing/ContainedElement/DescribedThing/Component/ImplementationThing/ConceptInstance
		enables : policy_optimization
		sameAs : dashboard_enabler
		hasInput : ANN_model/ANN_state_estimation_model/four_para_model/temp_readings_streaming/two_para_model
	optimization_algs
		type : NamedIndividual/Enabler/Thing/DTComponent/FidelityThing/ContainedElement/DescribedThing/Component/ImplementationThing/ConceptInstance
		enables : safe_adaptation
		sameAs : optimization_algs
		hasInput : ANN_model/ANN_state_estimation_model/controller_model/four_para_model/temp_readings_streaming/two_para_model
	state_estimator
		type : NamedIndividual/Enabler/Thing/DTComponent/FidelityThing/ContainedElement/DescribedThing/Component/ImplementationThing/ConceptInstance
		enables : anomaly_detector/heater_state_estimation_service/safe_adaptation
		sameAs : state_estimator
		hasInput : ANN_model/ANN_state_estimation_model/controller_model/four_para_model/two_para_model
	simulator
		type : NamedIndividual/Enabler/Thing/DTComponent/FidelityThing/ContainedElement/DescribedThing/Component/ImplementationThing/ConceptInstance
		enables : what_if_sim
		sameAs : simulator
		hasInput : controller_model/env_model/pt_and_env_model/pt_model/temp_readings_historical
	docker
		type : NamedIndividual/Enabler/Thing/DTComponent/FidelityThing/ContainedElement/DescribedThing/Component/ImplementationThing/ConceptInstance
		sameAs : docker
	godot
		type : NamedIndividual/Enabler/Thing/DTComponent/FidelityThing/ContainedElement/DescribedThing/Component/ImplementationThing/ConceptInstance
		enables : real_time_viz_service
		sameAs : godot
	influx_db
		type : NamedIndividual/Enabler/Thing/DTComponent/FidelityThing/ContainedElement/DescribedThing/Component/ImplementationThing/ConceptInstance
		sameAs : influx_db
	rabbit_mq
		type : NamedIndividual/Enabler/Thing/DTComponent/FidelityThing/ContainedElement/DescribedThing/Component/ImplementationThing/ConceptInstance
		IsCommEnabler : true
		sameAs : rabbit_mq
Models :
	ANN_model
		type : NamedIndividual/Model/Thing/DTComponent/FidelityThing/ContainedElement/DescribedThing/Component/ImplementationThing/Input/ConceptInstance
		inputTo : anomaly_detector_enabler/dashboard_enabler/optimization_algs/state_estimator
		sameAs : ANN_model
	ANN_state_estimation_model
		type : NamedIndividual/Model/Thing/DTComponent/FidelityThing/ContainedElement/DescribedThing/Component/ImplementationThing/Input/ConceptInstance
		inputTo : anomaly_detector_enabler/dashboard_enabler/optimization_algs/state_estimator
		sameAs : ANN_state_estimation_model
	controller_model
		type : NamedIndividual/Model/Thing/DTComponent/FidelityThing/ContainedElement/DescribedThing/Component/ImplementationThing/Input/ConceptInstance
		inputTo : optimization_algs/state_estimator/simulator
		sameAs : controller_model
	env_model
		type : NamedIndividual/Model/Thing/DTComponent/FidelityThing/ContainedElement/DescribedThing/Component/ImplementationThing/Input/ConceptInstance
		inputTo : simulator
		sameAs : env_model
	four_para_model
		type : NamedIndividual/Model/Thing/DTComponent/FidelityThing/ContainedElement/DescribedThing/Component/ImplementationThing/Input/ConceptInstance
		inputTo : anomaly_detector_enabler/dashboard_enabler/optimization_algs/state_estimator
		file_loc_str : models/plant_models/four_parameters_model/four_parameter_model.py
		sameAs : four_para_model
	pt_and_env_model
		type : NamedIndividual/Model/Thing/DTComponent/FidelityThing/ContainedElement/DescribedThing/Component/ImplementationThing/Input/ConceptInstance
		inputTo : simulator
		sameAs : pt_and_env_model
	pt_model
		type : NamedIndividual/Model/Thing/DTComponent/FidelityThing/ContainedElement/DescribedThing/Component/ImplementationThing/Input/ConceptInstance
		inputTo : simulator
		sameAs : pt_model
	two_para_model
		type : NamedIndividual/Model/Thing/DTComponent/FidelityThing/ContainedElement/DescribedThing/Component/ImplementationThing/Input/ConceptInstance
		inputTo : anomaly_detector_enabler/dashboard_enabler/optimization_algs/state_estimator
		sameAs : two_para_model
ProvidedThings :
	anomaly_warning
		type : NamedIndividual/Insight/ConnectionComponent/Thing/ContainedElement/DescribedThing/Component/ImplementationThing/ProvidedThing/TimeScaleThing/ConceptInstance
		hasTimeScale : slower_trt
		desc : anomaly detection
		sameAs : anomaly_warning
		providedBy : anomaly_detector
	commands
		type : NamedIndividual/Action/ConnectionComponent/Thing/ContainedElement/DescribedThing/Component/ImplementationThing/ProvidedThing/TimeScaleThing/AutomaticEnabledThing/ConceptInstance
		hasTimeScale : rt
		IsAutomatic : true
		sameAs : commands
	controller_control
		type : NamedIndividual/Action/ConnectionComponent/Thing/ContainedElement/DescribedThing/Component/ImplementationThing/ProvidedThing/TimeScaleThing/AutomaticEnabledThing/ConceptInstance
		hasTimeScale : rt
		desc : control policy updates to the PT
		sameAs : controller_control
		providedBy : policy_optimization/safe_adaptation
	dashboard
		type : NamedIndividual/Insight/ConnectionComponent/Thing/ContainedElement/DescribedThing/Component/ImplementationThing/ProvidedThing/TimeScaleThing/ConceptInstance
		hasTimeScale : rt
		desc : dashboard visualization of the current state and historical data
		sameAs : dashboard
	dashboard_viz
		type : NamedIndividual/Insight/ConnectionComponent/Thing/ContainedElement/DescribedThing/Component/ImplementationThing/ProvidedThing/TimeScaleThing/ConceptInstance
		hasTimeScale : slower_trt
		sameAs : dashboard_viz
	heater_state_estimation
		type : NamedIndividual/Insight/ConnectionComponent/Thing/ContainedElement/DescribedThing/Component/ImplementationThing/ProvidedThing/TimeScaleThing/ConceptInstance
		hasTimeScale : rt
		desc : state estimation of the heater
		sameAs : heater_state_estimation
		providedBy : heater_state_estimation_service
	real_time_viz
		type : NamedIndividual/Insight/ConnectionComponent/Thing/ContainedElement/DescribedThing/Component/ImplementationThing/ProvidedThing/TimeScaleThing/ConceptInstance
		hasTimeScale : rt
		desc : 3D visualization of the current state
		sameAs : real_time_viz
		providedBy : real_time_viz_service
	what_if_sim_results
		type : NamedIndividual/Insight/ConnectionComponent/Thing/ContainedElement/DescribedThing/Component/ImplementationThing/ProvidedThing/TimeScaleThing/ConceptInstance
		hasTimeScale : faster_trt
		desc :  what-if analysis for future behavior under different controller configurations
		sameAs : what_if_sim_results
		providedBy : what_if_sim
Data transmitted :
	controller_state_trans
		type : NamedIndividual/ConnectionComponent/Thing/DataTransmitted/ContainedElement/DescribedThing/Component/ImplementationThing/TimeScaleThing/AutomaticEnabledThing/ConceptInstance
		hasTimeScale : rt
		IsAutomatic : true
		sameAs : controller_state_trans
		asData : controller_state
	temp_readings_trans
		type : NamedIndividual/ConnectionComponent/Thing/DataTransmitted/ContainedElement/DescribedThing/Component/ImplementationThing/TimeScaleThing/AutomaticEnabledThing/ConceptInstance
		hasTimeScale : rt
		IsAutomatic : true
		sameAs : temp_readings_trans
		asData : temp_readings_streaming
		producedFrom : temp_sensor_1/temp_sensor_2/temp_sensor_3
Sensors :
	temp_sensor_1
		type : NamedIndividual/ConnectionComponent/Thing/SensingComponent/ContainedElement/DescribedThing/Component/ImplementationThing/TimeScaleThing/ConceptInstance
		sameAs : temp_sensor_1
		producedData : temp_readings_trans
	temp_sensor_2
		type : NamedIndividual/ConnectionComponent/Thing/SensingComponent/ContainedElement/DescribedThing/Component/ImplementationThing/TimeScaleThing/ConceptInstance
		sameAs : temp_sensor_2
		producedData : temp_readings_trans
	temp_sensor_3
		type : NamedIndividual/ConnectionComponent/Thing/SensingComponent/ContainedElement/DescribedThing/Component/ImplementationThing/TimeScaleThing/ConceptInstance
		sameAs : temp_sensor_3
		producedData : temp_readings_trans
System :
	fan
		type : NamedIndividual/ActingComponent/ConnectionComponent/Thing/ContainedElement/DescribedThing/Component/ImplementationThing/TimeScaleThing/ConceptInstance
		desc : Circulates air throughout box
		sameAs : fan
		isContainedIn : incubator
	heater
		type : NamedIndividual/ActingComponent/ConnectionComponent/Thing/ContainedElement/DescribedThing/Component/ImplementationThing/TimeScaleThing/ConceptInstance
		desc : Raises the temperature of surrounding air
		sameAs : heater
		isContainedIn : incubator
	controller
		type : NamedIndividual/ActingComponent/ConnectionComponent/Thing/ContainedElement/DescribedThing/Component/ImplementationThing/TimeScaleThing/ConceptInstance
		desc : Controls the fan and heater
		sameAs : controller
		isContainedIn : incubator
	power_supply
		type : NamedIndividual/ActingComponent/ConnectionComponent/Thing/ContainedElement/DescribedThing/Component/ImplementationThing/TimeScaleThing/ConceptInstance
		desc : Powers electrical components
		sameAs : power_supply
		isContainedIn : incubator
System environnement :
	surrounding_air
		type : NamedIndividual/Thing/ContainedElement/DescribedThing/Component/ImplementationThing/ConceptInstance
		desc : Heat sink
		sameAs : surrounding_air
		isContainedIn : room
	surface
		type : NamedIndividual/Thing/ContainedElement/DescribedThing/Component/ImplementationThing/ConceptInstance
		desc : Where the incubator is placed
		sameAs : surface
		isContainedIn : room
Data :
	controller_state
		type : NamedIndividual/Data/Thing/DTComponent/FidelityThing/ContainedElement/DescribedThing/Component/ImplementationThing/Input/ConceptInstance
		fromData : controller_state_trans
		sameAs : controller_state
	temp_readings_historical
		type : NamedIndividual/Data/Thing/DTComponent/FidelityThing/ContainedElement/DescribedThing/Component/ImplementationThing/Input/ConceptInstance
		inputTo : simulator
		sameAs : temp_readings_historical
	temp_readings_streaming
		type : NamedIndividual/Data/Thing/DTComponent/FidelityThing/ContainedElement/DescribedThing/Component/ImplementationThing/Input/ConceptInstance
		fromData : temp_readings_trans
		inputTo : dashboard_enabler/optimization_algs
		sameAs : temp_readings_streaming
Rabbit exchange :
	incubator_exchange
		type : NamedIndividual/Thing/ExchangeName/ConceptInstance
		sameAs : incubator_exchange
		exchange_name_str : Incubator_AMQP
Rabbit route :
	incubator_routing_key
		type : NamedIndividual/Thing/RoutingKey/ConceptInstance
		sameAs : incubator_routing_key
		routing_key_str : incubator.record.driver.state
		exchange : incubator_exchange
Rabbit source :
	incubator_source
		type : NamedIndividual/Thing/Source/ConceptInstance
		sameAs : incubator_source
		routeKey : incubator_routing_key
		source_str : low_level_driver
Rabbit message listener :
	sensor1ML
		type : NamedIndividual/Thing/MessageListener/ConceptInstance
		sameAs : sensor1ML
		sourceComponent : temp_sensor_1
		MLSource : t2
		MLTarget : temp_sensor_1
		route : incubator_source
	sensor2ML
		type : NamedIndividual/Thing/MessageListener/ConceptInstance
		sameAs : sensor2ML
		sourceComponent : temp_sensor_2
		MLSource : t2
		MLTarget : temp_sensor_2
		route : incubator_source
	sensor3ML
		type : NamedIndividual/Thing/MessageListener/ConceptInstance
		sameAs : sensor3ML
		sourceComponent : temp_sensor_3
		MLSource : t3
		MLTarget : temp_sensor_3
		route : incubator_source