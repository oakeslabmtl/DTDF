Services :
	anomaly_detector
		type : Thing/DTComponent/Service/NamedIndividual/ContainedElement/DescribedThing/Component/FidelityThing/ImplementationThing/TimeScaleThing/ConceptInstance
		atStage : operation
		provides : anomaly_warning
		enabledBy : anomaly_detector_enabler/state_estimator
		sameAs : anomaly_detector
	policy_optimization
		type : Thing/DTComponent/Service/NamedIndividual/ContainedElement/DescribedThing/Component/FidelityThing/ImplementationThing/TimeScaleThing/ConceptInstance
		atStage : operation
		provides : controller_control
		enabledBy : dashboard_enabler
		sameAs : policy_optimization
	real_time_viz_service
		type : Thing/DTComponent/Service/NamedIndividual/ContainedElement/DescribedThing/Component/FidelityThing/ImplementationThing/TimeScaleThing/ConceptInstance
		atStage : operation
		provides : real_time_viz
		HasVisualization : true
		enabledBy : godot
		sameAs : real_time_viz_service
	heater_state_estimation_service
		type : Thing/DTComponent/Service/NamedIndividual/ContainedElement/DescribedThing/Component/FidelityThing/ImplementationThing/TimeScaleThing/ConceptInstance
		atStage : operation
		provides : heater_state_estimation
		enabledBy : state_estimator
		sameAs : heater_state_estimation_service
	safe_adaptation
		type : Thing/DTComponent/Service/NamedIndividual/ContainedElement/DescribedThing/Component/FidelityThing/ImplementationThing/TimeScaleThing/ConceptInstance
		atStage : operation
		provides : controller_control
		enabledBy : optimization_algs/state_estimator
		sameAs : safe_adaptation
	what_if_sim
		type : Thing/DTComponent/Service/NamedIndividual/ContainedElement/DescribedThing/Component/FidelityThing/ImplementationThing/TimeScaleThing/ConceptInstance
		atStage : operation
		provides : what_if_sim_results
		enabledBy : simulator
		sameAs : what_if_sim
Enablers :
	anomaly_detector_enabler
		type : Thing/DTComponent/Enabler/NamedIndividual/ContainedElement/DescribedThing/Component/FidelityThing/ImplementationThing/ConceptInstance
		enables : anomaly_detector
		hasInput : four_para_model/ANN_model/ANN_state_estimation_model/two_para_model
		sameAs : anomaly_detector_enabler
	dashboard_enabler
		type : Thing/DTComponent/Enabler/NamedIndividual/ContainedElement/DescribedThing/Component/FidelityThing/ImplementationThing/ConceptInstance
		enables : policy_optimization
		hasInput : four_para_model/ANN_model/ANN_state_estimation_model/temp_readings_streaming/two_para_model
		sameAs : dashboard_enabler
	optimization_algs
		type : Thing/DTComponent/Enabler/NamedIndividual/ContainedElement/DescribedThing/Component/FidelityThing/ImplementationThing/ConceptInstance
		enables : safe_adaptation
		hasInput : four_para_model/ANN_model/ANN_state_estimation_model/controller_model/temp_readings_streaming/two_para_model
		sameAs : optimization_algs
	state_estimator
		type : Thing/DTComponent/Enabler/NamedIndividual/ContainedElement/DescribedThing/Component/FidelityThing/ImplementationThing/ConceptInstance
		enables : anomaly_detector/heater_state_estimation_service/safe_adaptation
		hasInput : four_para_model/ANN_model/ANN_state_estimation_model/controller_model/two_para_model
		sameAs : state_estimator
	simulator
		type : Thing/DTComponent/Enabler/NamedIndividual/ContainedElement/DescribedThing/Component/FidelityThing/ImplementationThing/ConceptInstance
		enables : what_if_sim
		hasInput : controller_model/env_model/pt_and_env_model/pt_model/temp_readings_historical
		sameAs : simulator
	docker
		type : Thing/DTComponent/Enabler/NamedIndividual/ContainedElement/DescribedThing/Component/FidelityThing/ImplementationThing/ConceptInstance
		sameAs : docker
	godot
		type : Thing/DTComponent/Enabler/NamedIndividual/ContainedElement/DescribedThing/Component/FidelityThing/ImplementationThing/ConceptInstance
		enables : real_time_viz_service
		sameAs : godot
	influx_db
		type : Thing/DTComponent/Enabler/NamedIndividual/ContainedElement/DescribedThing/Component/FidelityThing/ImplementationThing/ConceptInstance
		sameAs : influx_db
	rabbit_mq
		type : Thing/DTComponent/Enabler/NamedIndividual/ContainedElement/DescribedThing/Component/FidelityThing/ImplementationThing/ConceptInstance
		IsCommEnabler : true
		sameAs : rabbit_mq
Models :
	four_para_model
		type : Thing/DTComponent/Model/NamedIndividual/ContainedElement/DescribedThing/Input/Component/FidelityThing/ImplementationThing/ConceptInstance
		file_loc_str : models/plant_models/four_parameters_model/four_parameter_model.py
		inputTo : anomaly_detector_enabler/dashboard_enabler/optimization_algs/state_estimator
		sameAs : four_para_model
	ANN_model
		type : Thing/DTComponent/Model/NamedIndividual/ContainedElement/DescribedThing/Input/Component/FidelityThing/ImplementationThing/ConceptInstance
		inputTo : anomaly_detector_enabler/dashboard_enabler/optimization_algs/state_estimator
		sameAs : ANN_model
	ANN_state_estimation_model
		type : Thing/DTComponent/Model/NamedIndividual/ContainedElement/DescribedThing/Input/Component/FidelityThing/ImplementationThing/ConceptInstance
		inputTo : anomaly_detector_enabler/dashboard_enabler/optimization_algs/state_estimator
		sameAs : ANN_state_estimation_model
	controller_model
		type : Thing/DTComponent/Model/NamedIndividual/ContainedElement/DescribedThing/Input/Component/FidelityThing/ImplementationThing/ConceptInstance
		inputTo : optimization_algs/state_estimator/simulator
		sameAs : controller_model
	env_model
		type : Thing/DTComponent/Model/NamedIndividual/ContainedElement/DescribedThing/Input/Component/FidelityThing/ImplementationThing/ConceptInstance
		inputTo : simulator
		sameAs : env_model
	pt_and_env_model
		type : Thing/DTComponent/Model/NamedIndividual/ContainedElement/DescribedThing/Input/Component/FidelityThing/ImplementationThing/ConceptInstance
		inputTo : simulator
		sameAs : pt_and_env_model
	pt_model
		type : Thing/DTComponent/Model/NamedIndividual/ContainedElement/DescribedThing/Input/Component/FidelityThing/ImplementationThing/ConceptInstance
		inputTo : simulator
		sameAs : pt_model
	two_para_model
		type : Thing/DTComponent/Model/NamedIndividual/ContainedElement/DescribedThing/Input/Component/FidelityThing/ImplementationThing/ConceptInstance
		inputTo : anomaly_detector_enabler/dashboard_enabler/optimization_algs/state_estimator
		sameAs : two_para_model
ProvidedThings :
	anomaly_warning
		type : ConnectionComponent/Thing/Insight/NamedIndividual/ContainedElement/DescribedThing/Component/ProvidedThing/ImplementationThing/TimeScaleThing/ConceptInstance
		desc : anomaly detection
		hasTimeScale : slower_trt
		providedBy : anomaly_detector
		sameAs : anomaly_warning
	commands
		type : ConnectionComponent/Action/Thing/NamedIndividual/ContainedElement/DescribedThing/Component/ProvidedThing/ImplementationThing/TimeScaleThing/AutomaticEnabledThing/ConceptInstance
		hasTimeScale : rt
		IsAutomatic : true
		sameAs : commands
	controller_control
		type : ConnectionComponent/Action/Thing/NamedIndividual/ContainedElement/DescribedThing/Component/ProvidedThing/ImplementationThing/TimeScaleThing/AutomaticEnabledThing/ConceptInstance
		desc : control policy updates to the PT
		hasTimeScale : rt
		providedBy : policy_optimization/safe_adaptation
		sameAs : controller_control
	dashboard
		type : ConnectionComponent/Thing/Insight/NamedIndividual/ContainedElement/DescribedThing/Component/ProvidedThing/ImplementationThing/TimeScaleThing/ConceptInstance
		desc : dashboard visualization of the current state and historical data
		hasTimeScale : rt
		sameAs : dashboard
	dashboard_viz
		type : ConnectionComponent/Thing/Insight/NamedIndividual/ContainedElement/DescribedThing/Component/ProvidedThing/ImplementationThing/TimeScaleThing/ConceptInstance
		hasTimeScale : slower_trt
		sameAs : dashboard_viz
	heater_state_estimation
		type : ConnectionComponent/Thing/Insight/NamedIndividual/ContainedElement/DescribedThing/Component/ProvidedThing/ImplementationThing/TimeScaleThing/ConceptInstance
		desc : state estimation of the heater
		hasTimeScale : rt
		providedBy : heater_state_estimation_service
		sameAs : heater_state_estimation
	real_time_viz
		type : ConnectionComponent/Thing/Insight/NamedIndividual/ContainedElement/DescribedThing/Component/ProvidedThing/ImplementationThing/TimeScaleThing/ConceptInstance
		desc : 3D visualization of the current state
		hasTimeScale : rt
		providedBy : real_time_viz_service
		sameAs : real_time_viz
	what_if_sim_results
		type : ConnectionComponent/Thing/Insight/NamedIndividual/ContainedElement/DescribedThing/Component/ProvidedThing/ImplementationThing/TimeScaleThing/ConceptInstance
		desc :  what-if analysis for future behavior under different controller configurations
		hasTimeScale : faster_trt
		providedBy : what_if_sim
		sameAs : what_if_sim_results
Data transmitted :
	controller_state_trans
		type : ConnectionComponent/Thing/DataTransmitted/NamedIndividual/ContainedElement/DescribedThing/Component/ImplementationThing/TimeScaleThing/AutomaticEnabledThing/ConceptInstance
		hasTimeScale : rt
		IsAutomatic : true
		asData : controller_state
		sameAs : controller_state_trans
	temp_readings_trans
		type : ConnectionComponent/Thing/DataTransmitted/NamedIndividual/ContainedElement/DescribedThing/Component/ImplementationThing/TimeScaleThing/AutomaticEnabledThing/ConceptInstance
		hasTimeScale : rt
		IsAutomatic : true
		producedFrom : temp_sensor_1/temp_sensor_2/temp_sensor_3
		asData : temp_readings_streaming
		sameAs : temp_readings_trans
Sensors :
	temp_sensor_1
		type : ConnectionComponent/Thing/SensingComponent/NamedIndividual/ContainedElement/DescribedThing/Component/ImplementationThing/TimeScaleThing/ConceptInstance
		producedData : temp_readings_trans
		sameAs : temp_sensor_1
	temp_sensor_2
		type : ConnectionComponent/Thing/SensingComponent/NamedIndividual/ContainedElement/DescribedThing/Component/ImplementationThing/TimeScaleThing/ConceptInstance
		producedData : temp_readings_trans
		sameAs : temp_sensor_2
	temp_sensor_3
		type : ConnectionComponent/Thing/SensingComponent/NamedIndividual/ContainedElement/DescribedThing/Component/ImplementationThing/TimeScaleThing/ConceptInstance
		producedData : temp_readings_trans
		sameAs : temp_sensor_3
System :
	controller
		type : ActingComponent/ConnectionComponent/Thing/NamedIndividual/ContainedElement/DescribedThing/Component/ImplementationThing/TimeScaleThing/ConceptInstance
		isContainedIn : incubator
		desc : Controls the fan and heater
		sameAs : controller
	fan
		type : ActingComponent/ConnectionComponent/Thing/NamedIndividual/ContainedElement/DescribedThing/Component/ImplementationThing/TimeScaleThing/ConceptInstance
		isContainedIn : incubator
		desc : Circulates air throughout box
		sameAs : fan
	heater
		type : ActingComponent/ConnectionComponent/Thing/NamedIndividual/ContainedElement/DescribedThing/Component/ImplementationThing/TimeScaleThing/ConceptInstance
		isContainedIn : incubator
		desc : Raises the temperature of surrounding air
		sameAs : heater
	power_supply
		type : ActingComponent/ConnectionComponent/Thing/NamedIndividual/ContainedElement/DescribedThing/Component/ImplementationThing/TimeScaleThing/ConceptInstance
		isContainedIn : incubator
		desc : Powers electrical components
		sameAs : power_supply
System environnement :
	surface
		type : Thing/NamedIndividual/ContainedElement/DescribedThing/Component/ImplementationThing/ConceptInstance
		isContainedIn : room
		desc : Where the incubator is placed
		sameAs : surface
	surrounding_air
		type : Thing/NamedIndividual/ContainedElement/DescribedThing/Component/ImplementationThing/ConceptInstance
		isContainedIn : room
		desc : Heat sink
		sameAs : surrounding_air
Data :
	controller_state
		type : Thing/DTComponent/Data/NamedIndividual/ContainedElement/DescribedThing/Input/Component/FidelityThing/ImplementationThing/ConceptInstance
		fromData : controller_state_trans
		sameAs : controller_state
	temp_readings_historical
		type : Thing/DTComponent/Data/NamedIndividual/ContainedElement/DescribedThing/Input/Component/FidelityThing/ImplementationThing/ConceptInstance
		inputTo : simulator
		sameAs : temp_readings_historical
	temp_readings_streaming
		type : Thing/DTComponent/Data/NamedIndividual/ContainedElement/DescribedThing/Input/Component/FidelityThing/ImplementationThing/ConceptInstance
		fromData : temp_readings_trans
		inputTo : dashboard_enabler/optimization_algs
		sameAs : temp_readings_streaming
Rabbit exchange :
	incubator_exchange
		type : Thing/ExchangeName/NamedIndividual/ConceptInstance
		exchange_name_str : Incubator_AMQP
		sameAs : incubator_exchange
Rabbit route :
	incubator_routing_key
		type : Thing/RoutingKey/NamedIndividual/ConceptInstance
		exchange : incubator_exchange
		routing_key_str : incubator.record.driver.state
		sameAs : incubator_routing_key
Rabbit source :
	incubator_source
		type : Thing/Source/NamedIndividual/ConceptInstance
		routeKey : incubator_routing_key
		source_str : low_level_driver
		sameAs : incubator_source
Rabbit message listener :
	sensor1ML
		type : Thing/MessageListener/NamedIndividual/ConceptInstance
		route : incubator_source
		sourceComponent : temp_sensor_1
		MLSource : t2
		MLTarget : temp_sensor_1
		sameAs : sensor1ML
	sensor2ML
		type : Thing/MessageListener/NamedIndividual/ConceptInstance
		route : incubator_source
		sourceComponent : temp_sensor_2
		MLSource : t2
		MLTarget : temp_sensor_2
		sameAs : sensor2ML
	sensor3ML
		type : Thing/MessageListener/NamedIndividual/ConceptInstance
		route : incubator_source
		sourceComponent : temp_sensor_3
		MLSource : t3
		MLTarget : temp_sensor_3
		sameAs : sensor3ML